</style></head><body><div class="wrap"><header><div><div class="logo">Dr.脳トレ <span style="color:var(--gold)">X: PARADOX ✦</span></div><div class="tag">THE PARADOX EDITION</div></div><nav class="nav"><button id="homeBtn">ホーム</button><button id="dashBtn">記録を見る</button><button id="labBtn">脳トレ分析</button><button id="profileBtn">思考タイプ</button><button id="cityBtn">思考都市</button></nav></header><main id="app"></main><footer class="footer">毎日の小さな楽しみに。脳年齢はゲーム上の演出であり、医学的な検査・診断ではありません。</footer></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),app=$('#app'),KEY='yohaku-brain-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}};data={best:{},history:[],days:[],clears:0,daily:{},...data};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};let session=0,timer=null,timeout=null,mode='',dailyMode=false,dailyStep=0,dailyResults=[],rng=Math.random;const clear=()=>{session++;clearInterval(timer);clearTimeout(timeout);timer=timeout=null};const rand=(a,b)=>Math.floor(rng()*(b-a+1))+a;function seeded(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}const names={switcher:'認知スイッチ・ラボ',rps:'後出しジャンケン',math:'計算パズル',digits:'瞬間数字記憶',pattern:'パターン記憶',words:'言葉の並び替え'};const descriptions={switcher:'色と意味が衝突。変わるルールに瞬時に適応。',rps:'指示と逆転する思考を、30秒で。',math:'10問の計算で、頭をすっきり。',digits:'数字を覚えて、小さい順に並べる。',pattern:'光ったマスの順番を再現。',words:'文字を並べ替えて、言葉を発見。'};const fmt=n=>Number(n).toFixed(1)+'秒';const bestText=k=>data.best[k]==null?'まだ記録がありません':(k==='math'?fmt(data.best[k]):(k==='rps'||k==='switcher')?data.best[k]+'点':data.best[k]+'問クリア');function streak(){const ds=new Set(data.days),d=new Date();let n=0;if(!ds.has(today()))d.setDate(d.getDate()-1);while(ds.has([d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'))){n++;d.setDate(d.getDate()-1)}return n}function mark(){if(!data.days.includes(today()))data.days.push(today());save()}function layout(title,body,info=''){app.innerHTML=`<section class="game"><div class="topline"><button class="ghost" id="back">← 戻る</button><span class="pill">${info||'DAILY MIND GAMES'}</span></div><div class="panel" id="gamepanel"><h2>${title}</h2>${body}</div></section>`;$('#back').onclick=()=>{clear();dailyMode=false;home()}}function flash(ok){const p=$('#gamepanel');if(!p)return;p.classList.remove('feedback-good','feedback-bad');void p.offsetWidth;p.classList.add(ok?'feedback-good':'feedback-bad')}function home(){clear();dailyMode=false;const done=data.daily[today()];app.innerHTML=`<section class="hero"><div class="eyebrow">WELCOME TO THE MIND LAB / VOL. 01</div><h1>思考を、<br><em>遊び尽くせ。</em></h1><p>Dr.脳トレ NEO — 反射、記憶、計算、言葉。6つの知的ゲームで、今日の自分に挑む。</p></section><section class="daily"><div class="eyebrow">TODAY'S CHALLENGE · ${today()}</div><h2>本日のミッション</h2><p>日付で決まる3つの問題。毎日1回だけの、知的な腕試し。</p><button class="primary" id="dailyBtn" ${done?'disabled':''}>${done?'本日は挑戦済み ✓':'本日のミッションに挑戦する →'}</button>${done?`<p class="hint">本日の結果：${done.correct}/3問正解</p>`:''}</section><section class="mission-strip"><div><span class="eyebrow">YOUR MIND, IN MOTION</span><h2>続けた分だけ、記録が残る。</h2><p>昨日の自分を超えるための小さな実験。</p></div><div class="mini-stats"><div><strong>${streak()}</strong><small>連続日数</small></div><div><strong>${data.history.length}</strong><small>挑戦回数</small></div><div><strong>${data.clears}</strong><small>累計正解</small></div></div></section><div class="eyebrow">THE SIX LABS</div><h2>6つの脳トレ・ラボ</h2><div class="cards">${Object.keys(names).map((k,i)=>`<article class="card"><span class="num">0${i+1} / TRAINING</span><h3>${names[k]}</h3><p>${descriptions[k]}</p><div class="best">自己ベスト：${bestText(k)}</div><button class="primary full" data-game="${k}">プレイする →</button></article>`).join('')}</div>`;$('#dailyBtn').onclick=startDaily;document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game))}function start(k){clear();mode=k;dailyMode=false;rng=Math.random;mark();({switcher,rps,math,digits,pattern,words,paradox})[k]()}function finish(k,metric,quality,correct,total,extra=''){clear();const rank=quality>=.9?'S':quality>=.7?'A':quality>=.45?'B':'C',age=rank==='S'?'20〜30代相当':rank==='A'?'30〜40代相当':rank==='B'?'40〜50代相当':'50代以上相当';const prev=data.best[k],better=k==='math'?prev==null||metric<prev:prev==null||metric>prev;if(better)data.best[k]=metric;data.clears+=correct;data.history.push({date:new Date().toLocaleString('ja-JP'),game:k,metric,rank,correct,total});data.history=data.history.slice(-100);save();layout('今回の結果',`<div class="result"><div class="eyebrow">SESSION COMPLETE</div><div class="rank">${rank}</div><p class="metric">${k==='math'?fmt(metric):(k==='rps'||k==='switcher')?metric+'点':metric+'問クリア'}</p><p>${correct} / ${total} 正解 ${better?'· 自己ベスト更新！':''}</p><p><strong>脳年齢の目安：</strong>${age}</p><p class="hint">※ゲーム成績に基づく演出です。実際の脳年齢を示すものではありません。</p><p>${rank==='S'?'素晴らしい集中力！この調子で毎日の習慣に。':rank==='A'?'いい調子です。焦らず正確さも意識してみましょう。':rank==='B'?'十分な一歩です。少しずつ慣れていきましょう。':'まずはゆっくり。繰り返すことでコツがつかめます。'}</p>${extra}<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="primary" id="again">もう一度</button><button class="secondary" id="goHome">ホームへ</button></div></div>`,'RESULT');$('#again').onclick=()=>start(k);$('#goHome').onclick=home}
function rps(){let score=0,correct=0,total=0,combo=0,remaining=30,active=true;const hands=['グー','チョキ','パー'],icons=['✊','✌️','✋'];layout(names.rps,`<div class="topline"><span id="rpsScore">スコア 0 · 連続 0</span><strong id="rpsTime">残り30秒</strong></div><div class="progress"><div id="timeBar" style="width:100%"></div></div><div class="prompt"><div class="hint">相手の手</div><div class="big" id="opponent"></div><div class="instruction" id="order"></div></div><div class="choices three">${hands.map((h,i)=>`<button class="choice" data-hand="${i}">${icons[i]}<div>${h}</div></button>`).join('')}</div>`,'30秒チャレンジ');let opponent,order;function next(){opponent=rand(0,2);order=rand(0,2);$('#opponent').textContent=icons[opponent]+' '+hands[opponent];$('#order').textContent=['勝ってください','負けてください','あいこにしてください'][order]}next();document.querySelectorAll('[data-hand]').forEach(b=>b.onclick=()=>{if(!active)return;const selected=+b.dataset.hand,expected=order===2?opponent:order===0?(opponent+1)%3:(opponent+2)%3,ok=selected===expected;total++;if(ok){correct++;combo++;score+=10+Math.min(combo-1,10)*2}else combo=0;flash(ok);$('#rpsScore').textContent=`スコア ${score} · 連続 ${combo}`;next()});const id=session;timer=setInterval(()=>{if(id!==session)return;remaining--;$('#rpsTime').textContent='残り'+remaining+'秒';$('#timeBar').style.width=remaining/30*100+'%';if(remaining<=0){active=false;finish('rps',score,Math.min(1,(correct/Math.max(1,total))*.7+Math.min(correct/20,1)*.3),correct,total)}},1000)}

function switcher(){let n=0,correct=0,combo=0,points=0,active=true;const palette=[['赤','#bd4443'],['青','#246aaf'],['緑','#26815a'],['黄','#aa780d']];const rounds=12;let question=null;layout('認知スイッチ・ラボ',`<div class="eyebrow">EXPERIMENT 06 / COGNITIVE SWITCH</div><p class="hint">文字の意味と表示色が食い違います。上のルールだけを見て答えてください。</p><div class="topline"><strong id="switchProgress">1 / 12</strong><span class="pill" id="switchCombo">連続 0</span></div><div class="progress"><div id="switchBar" style="width:0%"></div></div><div class="switch-stage"><div class="switch-rule" id="switchRule"></div><div class="switch-word" id="switchWord"></div><p class="hint" id="switchPrompt">選択してください</p></div><div class="choices" id="switchChoices">${palette.map((v,i)=>`<button class="choice" data-switch="${i}">${v[0]}</button>`).join('')}</div><p class="hint">※視認しにくい場合は無理をせず、ほかのゲームをお楽しみください。</p>`,'ルール切替・全12問');const buttons=[...document.querySelectorAll('[data-switch]')];function next(){if(n>=rounds){active=false;finish('switcher',points,correct/rounds,correct,rounds,`<p class="hint">ルールの切替に慣れてきたら、速さより正確さを意識しましょう。</p>`);return}const text=rand(0,3),color=rand(0,3),rule=n<3?n%2:n%3===0?2:rand(0,1);question={text,color,rule};$('#switchProgress').textContent=`${n+1} / ${rounds}`;$('#switchBar').style.width=(n/rounds*100)+'%';$('#switchRule').textContent=['文字の意味を答える','文字の「色」を答える','色と意味が同じなら「同じ」、違えば「違う」'][rule];$('#switchWord').textContent=palette[text][0];$('#switchWord').style.color=palette[color][1];$('#switchPrompt').textContent=rule===2?'一致していますか？':'該当する色を選んでください';buttons.forEach((b,i)=>{b.disabled=false;b.textContent=rule===2?['同じ','違う','—','—'][i]:palette[i][0];b.style.display=rule===2&&i>=2?'none':''})}buttons.forEach(b=>b.onclick=()=>{if(!active)return;const chosen=+b.dataset.switch,expected=question.rule===0?question.text:question.rule===1?question.color:question.text===question.color?0:1;const ok=chosen===expected;correct+=Number(ok);combo=ok?combo+1:0;points+=ok?10+Math.min(combo,5)*2:0;flash(ok);$('#s on/json,.json" hidden></div></section>`;$('#returnHome').onclick=home;$('#exportProgress').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dr-brain-neo-progress-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importProgress').onclick=()=>$('#progressFile').click();$('#progressFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error('ファイルが大きすぎます');const obj=JSON.parse(await f.text());const d=obj.data;if(!d||typeof d!=='object'||!Array.isArray(d.history)||!Array.isArray(d.days)||!d.best||typeof d.best!=='object'||!d.daily||typeof d.daily!=='object'||!Number.isFinite(d.clears))throw Error('記録ファイルの形式が違います');if(!confirm('現在の記録を読み込んだ記録で置き換えます。よろしいですか？'))return;data={best:d.best,history:d.history.slice(-100),days:d.days.slice(-1000),clears:d.clears,daily:d.daily};save();lab()}catch(err){alert('読み込みに失敗しました：'+err.message)}}}

 answer=[Math.max(n,m),n%2===0?'はい':'いいえ',n%3===0?'はい':'いいえ',n%5===0?'はい':'いいえ',isPrime(n)?'はい':'いいえ',String(n).includes('0')?'はい':'いいえ','はい',n===m?'はい':'いいえ','●'][v];
}else if(cat==='計算・論理'){
 if(v===0){q=a+' + '+b;answer=a+b}
 if(v===1){q=(a+b)+' − '+a;answer=b}
 if(v===2){a=rand(2,12);b=rand(2,12);q=a+' × '+b;answer=a*b}
 if(v===3){a=rand(2,12);b=rand(2,12);q=(a*b)+' ÷ '+a;answer=b}
 if(v===4){q=a+' の2乗';answer=a*a}
 if(v===5){q=a+' → '+(a+3)+' → '+(a+6)+' → ?';answer=a+9}
 if(v===6){q=a+' と '+b+' の平均';answer=(a+b)/2}
 if(v===7){q=a+' + ? = '+(a+b);answer=b}
 if(v===8){a=rand(1,9)*10;q=a+' の10%';answer=a/10}
}else if(cat==='視覚・直感'){
 const shapes=['●','▲','■','★'];const symbol=pick(shapes),other=pick(shapes.filter(x=>x!==symbol)),count=rand(2,7);
 if(v===0||v===5){q=Array(count).fill(symbol).join(' ');answer=count}
 if(v===1){q=symbol+' '+symbol+' '+other+' '+symbol;answer=other}
 if(v===2){q='← の逆方向';answer='→'}
 if(v===3){q='右 の反対';answer='左'}
 if(v===4){q='上 の反対';answer='下'}
 if(v===6){q='●●●●● と ▲▲▲';answer='●'}
 if(v===7){q='■■ と ★★★★★';answer='■'}
}else if(cat==='言語・発想'){
 const w=pick(words);q=w;
 answer=[Array.from(w).length,(w.match(/[あいうえお]/g)||[]).length,Array.from(w).reverse().join(''),Array.from(w)[0],Array.from(w).at(-1)][v];
 note=['何文字？','あ・い・う・え・お は何個？','逆から読むと？','最初の文字は？','最後の文字は？'][v]
}else{
 if(v===0){q=a+' + '+b+' = ? ただし不正解を選べ';answer=a+b+1;pool=[a+b,a+b+1,a+b,a+b]}
 if(v===1){q=a+' と '+b+'、小さい方を選べ';answer=Math.min(a,b)}
 if(v===2){q='「右」の反対を選べ';answer='左'}
}
if(!pool.length){if(typeof answer==='number'){pool=[answer,answer+1,answer+2,answer-1]}else if(['はい','いいえ'].includes(answer)){pool=['はい','いいえ']}else if(['●','▲','■','★'].includes(answer)){pool=shapesSafe()}else if(['←','→','左','右','上','下'].includes(answer)){pool=['←','→','左','右','上','下']}else if(cat==='言語・発想'){pool=[answer,...shuffle(words).slice(0,5)]}else{pool=[answer,'0','1','2']}}
pool=[...new Set(pool.map(String))];if(!pool.includes(String(answer)))pool.push(String(answer));return {q,note,answer:String(answer),options:shuffle(pool).slice(0,6),memory:cat==='記憶'};
}
function shapesSafe(){return ['●','▲','■','★']}
let root,active=null,token=0,score=0,round=0;
function init(){if(document.getElementById('open50'))return;const nav=document.querySelector('.nav');if(!nav)return;const btn=document.createElement('button');btn.id='open50';btn.textContent='50種の脳トレ';btn.onclick=show;nav.append(btn);root=document.createElement('div');root.id='fiftyLab';root.hidden=true;root.innerHTML='<div class="inner" id="fiftyInner"></div>';document.body.append(root)}
function show(){init();root.hidden=false;document.body.style.overflow='hidden';catalog()}
function close(){token++;root.hidden=true;document.body.style.overflow=''}
function catalog(){token++;const el=document.getElementById('fiftyInner');el.innerHTML='<button class="back" id="close50">← ホームへ</button><h1>50の知的実験</h1><p>既存の7種＋新作43種。新作はそれぞれ異なる問い方で遊べます。</p><p>新作43種から選んでください。既存7種はホームでプレイできます。</p><div class="catalog" id="fiftyCards"></div>';document.getElementById('close50').onclick=close;const cards=document.getElementById('fiftyCards');groups.forEach(([cat,names])=>names.forEach(name=>{const idx=all.findIndex(x=>x.name===name);const b=document.createElement('button');b.className='labcard';b.innerHTML='<small>'+cat+' / '+String(idx+8).padStart(2,'0')+'</small><strong>'+name+'</strong><small>5問のミニチャレンジ →</small>';b.onclick=()=>play(idx);cards.append(b)}))}
function play(idx){active=all[idx];round=0;score=0;token++;question()}
function question(){const id=++token,g=make(active),el=document.getElementById('fiftyInner');el.innerHTML='<button class="back" id="back50">← 50種一覧</button><div class="playarea"><small>'+active.category+' / '+active.name+'</small><h2>第 '+(round+1)+' / 5 問</h2><div class="bar"><div style="width:'+round*20+'%"></div></div><div class="question" id="fiftyQuestion"></div><p id="fiftyNote"></p><div class="options" id="fiftyOptions"></div><p id="fiftyFeedback" aria-live="polite"></p></div>';document.getElementById('back50').onclick=catalog;
const prompt=document.getElementById('fiftyQuestion'),note=document.getElementById('fiftyNote'),opts=document.getElementById('fiftyOptions');
function choices(){if(id!==token)return;prompt.textContent=g.memory?g.note:g.q;note.textContent=g.memory?'思い出して答えましょう':g.note;g.options.forEach(value=>{const b=document.createElement('button');b.textContent=value;b.onclick=()=>{if(id!==token)return;const ok=value===g.answer;score+=+ok;opts.querySelectorAll('button').forEach(x=>x.disabled=true);document.getElementById('fiftyFeedback').textContent=ok?'正解！':'正解は '+g.answer;setTimeout(()=>{if(id!==token)return;round++;if(round===5)end();else question()},850)};opts.append(b)})}
if(g.memory){prompt.textContent=g.q;note.textContent='3秒で覚えよう';setTimeout(choices,3000)}else choices();
}
function end(){const el=document.getElementById('fiftyInner');let history=[];try{history=JSON.parse(localStorage.getItem('drbrain50history')||'[]')}catch{}history.push({name:active.name,score,date:new Date().toISOString()});localStorage.setItem('drbrain50history',JSON.stringify(history.slice(-200)));el.innerHTML='<div class="playarea"><h1>実験完了</h1><p>'+active.name+'</p><div class="question">'+score+' / 5</div><p>これはゲーム内の成績で、医学的な脳年齢や認知機能を測るものではありません。</p><button class="back" id="again50">もう一度</button> <button class="back" id="list50">別の実験へ</button></div>';document.getElementById('again50').onclick=()=>play(all.indexOf(active));document.getElementById('list50').onclick=catalog}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
